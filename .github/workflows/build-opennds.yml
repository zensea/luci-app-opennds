name: Build openNDS and LuCI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Repository commit to reproduce; empty uses the selected branch
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Exact repository commit containing the official submodule pointer
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: aarch64_cortex-a53-openwrt-24.10 build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      OUTPUT_DIR: ${{ github.workspace }}/artifacts
      SDK_ARCH: aarch64_cortex-a53-openwrt-24.10
      SDK_BRANCH: openwrt-24.10
      APP_DIR: ${{ github.workspace }}/source/luci-app-opennds

    steps:
      - name: Checkout repository and official source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Prepare SDK feed
        run: |
          set -euo pipefail
          test -e source/opennds/.git
          test -z "$(git -C source/opennds status --porcelain)"
          test "$(git -C source/opennds remote get-url origin)" = https://github.com/openNDS/openNDS.git
          upstream_sha="$(git -C source/opennds rev-parse HEAD)"
          [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]
          gitlink_sha="$(git -C source ls-tree HEAD -- opennds | awk '{print $3}')"
          test "$gitlink_sha" = "$upstream_sha"
          mkdir -p "$OUTPUT_DIR" sdk-output feed/luci-app-opennds feed/opennds feed/.sources
          cp -R "$APP_DIR/Makefile" "$APP_DIR/LICENSE" "$APP_DIR/htdocs" "$APP_DIR/root" "$APP_DIR/po" feed/luci-app-opennds/
          cp source/opennds/linux_openwrt/opennds/Makefile feed/opennds/Makefile
          upstream_version="$(sed -n 's/^#define VERSION "\([^"]*\)"/\1/p' source/opennds/src/conf.h)"
          [[ "$upstream_version" =~ ^[0-9][0-9A-Za-z.+_~-]*$ ]]
          source_file="opennds-$upstream_version-$upstream_sha.tar.gz"
          git -C source/opennds archive --format=tar --prefix="opennds-$upstream_version/" HEAD \
            | gzip -n > "feed/.sources/$source_file"
          source_hash="$(sha256sum "feed/.sources/$source_file" | cut -d' ' -f1)"
          commit_time="$(git -C source/opennds log -1 --format=%ct)"
          node - "$upstream_version" "$source_file" "$source_hash" "$commit_time" "$upstream_sha" <<'NODE'
          const fs = require('node:fs');
          const [version, filename, hash, timestamp, sha] = process.argv.slice(2);
          const recipe = 'feed/opennds/Makefile';
          let text = fs.readFileSync(recipe, 'utf8');
          if (!text.includes('PKG_VERSION:=' + version + '\n')) throw Error('Official recipe version differs from source');
          const release = text.match(/^PKG_RELEASE:=(\S+)$/m)?.[1];
          if (!release) throw Error('Missing official package release');
          const packageRelease = release + '.git' + timestamp + '.' + sha.slice(0, 12);
          const fields = { PKG_SOURCE: filename, PKG_SOURCE_URL: 'file:///feed/.sources', PKG_HASH: hash, PKG_RELEASE: packageRelease };
          for (const [key, value] of Object.entries(fields)) {
            const expression = new RegExp('^' + key + ':=.*$', 'm');
            if (!expression.test(text)) throw Error('Missing official recipe field: ' + key);
            text = text.replace(expression, key + ':=' + value);
          }
          text = text.replace(/^(PKG_HASH:=.*)$/m, '$1\nPKG_BUILD_DIR:=$(BUILD_DIR)/opennds-$(PKG_VERSION)');
          fs.writeFileSync(recipe, text);
          fs.appendFileSync(process.env.GITHUB_ENV, 'OPENNDS_PACKAGE_RELEASE=' + packageRelease + '\n');
          NODE
          printf 'OPENNDS_SOURCE_SHA=%s\nOPENNDS_PACKAGE_VERSION=%s\n' "$upstream_sha" "$upstream_version" >> "$GITHUB_ENV"
          find feed/luci-app-opennds feed/opennds -type d -exec chmod 755 {} +
          find feed/luci-app-opennds feed/opennds -type f -exec chmod 644 {} +
          chmod 755 \
            feed/luci-app-opennds/root/etc/uci-defaults/80_luci-app-opennds \
            feed/luci-app-opennds/root/usr/libexec/luci-opennds-restart \
            feed/luci-app-opennds/root/usr/lib/opennds/theme_luci.sh \
            feed/luci-app-opennds/root/usr/lib/opennds/status_luci.sh
          {
            printf 'plugin_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'repository_commit=%s\n' "$(git -C source rev-parse HEAD)"
            printf 'opennds_commit=%s\n' "$upstream_sha"
            printf 'opennds_version=%s\n' "$upstream_version"
            printf 'opennds_source_sha256=%s\n' "$source_hash"
            printf 'sdk_image=ghcr.io/openwrt/sdk:%s\n' "$SDK_ARCH"
            printf 'sdk_branch=%s\n' "$SDK_BRANCH"
            printf 'sdk_action_commit=f5813d30eeef3534b58ac7e79c5d8842b6035434\n'
            printf 'feed=opennds\n'
          } | tee "$OUTPUT_DIR/build-info.txt"

      - name: Run plugin regression tests
        working-directory: source/luci-app-opennds
        run: |
          set -euo pipefail
          node --test tests/*.test.cjs 2>&1 | tee "$OUTPUT_DIR/regression.log"

      - name: Run native portal, configuration and status tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjson-c-dev
          bash "$APP_DIR/tests/run-native.sh" "$OUTPUT_DIR"

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ env.SDK_ARCH }}
          CONTAINER: ghcr.io/openwrt/sdk
          FEEDNAME: opennds
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/sdk-output
          PACKAGES: opennds luci-app-opennds
          BUILD_LOG: '1'
          NO_REFRESH_CHECK: '1'
          NO_SHFMT_CHECK: '1'
          V: s

      - name: Collect and verify packages
        run: |
          set -euo pipefail
          test "$(git -C source/opennds rev-parse HEAD)" = "$OPENNDS_SOURCE_SHA"
          test -z "$(git -C source/opennds status --porcelain)"
          verified_packages="$RUNNER_TEMP/opennds-verified-packages"
          mkdir -p "$verified_packages"
          for name in opennds luci-app-opennds luci-i18n-opennds-zh-cn; do
            mapfile -t packages < <(find sdk-output/bin/packages -type f \
              \( -name "${name}_*.ipk" -o -name "${name}-[0-9]*.apk" \))
            test "${#packages[@]}" -eq 1
            test -s "${packages[0]}"
            case "${packages[0]}" in
              *.ipk)
                tar -xzOf "${packages[0]}" ./control.tar.gz | tar -xzOf - ./control \
                  | tee "$OUTPUT_DIR/$name.control.txt"
                grep -qx "Package: $name" "$OUTPUT_DIR/$name.control.txt"
                if test "$name" = opennds; then
                  grep -qx 'Architecture: aarch64_cortex-a53' "$OUTPUT_DIR/$name.control.txt"
                  grep -Fqx "Version: $OPENNDS_PACKAGE_VERSION-r$OPENNDS_PACKAGE_RELEASE" "$OUTPUT_DIR/$name.control.txt"
                  mkdir -p "$RUNNER_TEMP/opennds-daemon"
                  tar -xzOf "${packages[0]}" ./data.tar.gz | tar -xzf - -C "$RUNNER_TEMP/opennds-daemon"
                else
                  grep -qx 'Architecture: all' "$OUTPUT_DIR/$name.control.txt"
                fi
                tar -xzOf "${packages[0]}" ./data.tar.gz | tar -tzf - \
                  > "$OUTPUT_DIR/$name.files.txt"
                if test "$name" = luci-app-opennds; then
                  mkdir -p "$RUNNER_TEMP/opennds-package"
                  tar -xzOf "${packages[0]}" ./data.tar.gz \
                    | tar -xzf - -C "$RUNNER_TEMP/opennds-package"
                fi
                printf 'package_format_%s=ipk\n' "$name" >> "$OUTPUT_DIR/build-info.txt"
                ;;
              *.apk)
                test "$(head -c 3 "${packages[0]}")" = ADB
                printf 'package_format_%s=apk-v3\n' "$name" >> "$OUTPUT_DIR/build-info.txt"
                ;;
            esac
            cp "${packages[0]}" "$verified_packages/"
          done
          if test -f "$OUTPUT_DIR/luci-app-opennds.files.txt"; then
            package_views="$RUNNER_TEMP/opennds-package/www/luci-static/resources/view/opennds"
            node --check "$package_views/../../opennds.js"
            for view in config overview studio; do
              node --check "$package_views/$view.js"
            done
            OPENNDS_TEST_VIEWS_DIR="$package_views" node --test "$APP_DIR/tests/regression.test.cjs" \
              2>&1 | tee "$OUTPUT_DIR/packaged-regression.log"
            grep -qx './www/luci-static/resources/opennds.js' "$OUTPUT_DIR/luci-app-opennds.files.txt"
            grep -qx './usr/share/rpcd/ucode/opennds.uc' "$OUTPUT_DIR/luci-app-opennds.files.txt"
            grep -qx './usr/libexec/luci-opennds-status.uc' "$OUTPUT_DIR/luci-app-opennds.files.txt"
            grep -qx './usr/lib/opennds/theme_luci.sh' "$OUTPUT_DIR/luci-app-opennds.files.txt"
            grep -qx './usr/lib/opennds/status_luci.sh' "$OUTPUT_DIR/luci-app-opennds.files.txt"
            if grep -qx './etc/config/opennds' "$OUTPUT_DIR/luci-app-opennds.files.txt"; then
              printf 'Unexpected daemon configuration in plugin package\n' >&2
              exit 1
            fi
          fi
          python3 - "$RUNNER_TEMP/opennds-daemon" source/opennds <<'PY'
          import os, pathlib, struct, sys
          payload = pathlib.Path(sys.argv[1])
          for filename in ('opennds', 'ndsctl'):
              binary = (payload / 'usr/bin' / filename).read_bytes()
              assert binary[:6] == b'\x7fELF\x02\x01', 'Expected a little-endian 64-bit ELF'
              assert struct.unpack_from('<H', binary, 18)[0] == 183, 'Expected AArch64 binary'
          binary = (payload / 'usr/bin/opennds').read_bytes()
          assert ('This is openNDS version ' + os.environ['OPENNDS_PACKAGE_VERSION']).encode() in binary
          config = (payload / 'etc/config/opennds').read_bytes()
          official_config = (pathlib.Path(sys.argv[2]) / 'linux_openwrt/opennds/files/etc/config/opennds').read_bytes()
          assert config == official_config, 'Packaged configuration differs from official source'
          print('Official daemon architecture, version and original configuration verified')
          PY
          docker image inspect sdk --format '{{.Id}}' >> "$OUTPUT_DIR/build-info.txt"
          cd "$verified_packages"
          find . -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -print0 \
            | sort -z | xargs -0 sha256sum | tee SHA256SUMS
          mkdir -p "$OUTPUT_DIR/packages"
          cp ./*.ipk SHA256SUMS "$OUTPUT_DIR/packages/"

      - name: Collect SDK build logs
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          if test -d sdk-output/logs; then
            cp -R sdk-output/logs "$OUTPUT_DIR/sdk-logs"
          fi

      - name: Upload packages and build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: luci-app-opennds-${{ env.SDK_ARCH }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
